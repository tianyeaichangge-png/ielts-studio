<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="braun-body" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F2" />
      <stop offset="100%" stop-color="#E6E4DD" />
    </linearGradient>
    <linearGradient id="braun-dial" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFECE4" />
      <stop offset="100%" stop-color="#FAF8F2" />
    </linearGradient>
  </defs>

  <!-- Outer Tactile Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#braun-body)" stroke="#CFCBC0" stroke-width="2" />
  <!-- Subtle Top Highlight Edge -->
  <path d="M16 4H48C54.6274 4 60 9.37258 60 16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Precision Dial Ring -->
  <circle cx="32" cy="32" r="18" fill="url(#braun-dial)" stroke="#C8C4B8" stroke-width="1.5" />

  <!-- Minimalist Calibration Ticks (12, 3, 6, 9 o'clock) -->
  <line x1="32" y1="9" x2="32" y2="12" stroke="#262523" stroke-width="2" stroke-linecap="round" />
  <line x1="55" y1="32" x2="52" y2="32" stroke="#7A7873" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="55" x2="32" y2="52" stroke="#7A7873" stroke-width="1.5" stroke-linecap="round" />
  <line x1="9" y1="32" x2="12" y2="32" stroke="#7A7873" stroke-width="1.5" stroke-linecap="round" />

  <!-- Braun Classic Signal Orange Indicator Dot (#EA5B25) -->
  <circle cx="32" cy="32" r="7" fill="#EA5B25" />
  <circle cx="30" cy="30" r="2" fill="#FFFFFF" opacity="0.45" />
</svg>
